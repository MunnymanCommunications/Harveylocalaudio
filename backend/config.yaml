server:
  host: "0.0.0.0"
  port: 8765
  api_key: ""  # Auto-generated on first run if empty
  cors_origins:
    - "*"

llm:
  provider: "ollama"
  model: "nemotron-mini"  # Options: nemotron-mini, gemma3:12b, gemma3:27b
  base_url: "http://localhost:11434"
  temperature: 0.4
  max_tokens: 1024
  top_p: 0.9
  stream: true

stt:
  engine: "whisper"
  model: "base"  # Options: tiny, base, small, medium, large, large-v2, large-v3
  language: "en"
  device: "cpu"  # Options: cuda, cpu (CPU to save GPU memory for LLM)
  compute_type: "int8"  # Options: float16, float32, int8

tts:
  engine: "coqui"  # Coqui XTTS v2
  voice: "default"  # Options: default, male, female, custom (or path to voice sample)
  speed: 1.0
  language: "en"  # Options: en, es, fr, de, it, pt, pl, tr, ru, nl, cs, ar, zh-cn, ja
  device: "cuda"  # Options: cuda, cpu (CUDA recommended for low latency)

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  format: "wav"

conversation:
  max_history: 10
  context_window: 4096
  system_prompt: "You are HARVEY, a survival and emergency assistance AI. You provide accurate, potentially life-saving information based on verified survival manuals and first-aid guides. Be clear, concise, and accurate - lives may depend on your answers. Always cite your sources when using manual information. If you're unsure, say so - never guess about medical or survival advice."

survival_rag:
  enabled: true  # Enable survival knowledge retrieval
  manuals_dir: "survival_manuals"  # Directory containing survival manual JSON files
  ultra_low_latency: false  # Set to true for 1-2 sentence emergency answers

logging:
  level: "INFO"
  file: "logs/server.log"
  max_size: 10485760  # 10MB
  backup_count: 5
